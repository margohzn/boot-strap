<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First bootstrap project</title>

    <!--Link your css file here-->
    <link rel="stylesheet" href="style.css">

    <!--Font Awesome-->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">

    <!--Link Google Font files here-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">

    <!--Bootstrap4 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <!--Use this for Carousel-->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <!--USe this for lightbox-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.8.2/css/lightbox.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.8.2/js/lightbox.min.js"></script>

</head>
    <body>
        <!--creating navigation bar-->
        <nav class="navbar navbar-dark navbar-expand-md bg-dark fixed-top">
            <a href="#" class="navbar-band">
                <img src="images/icon.png" width="30">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse"><span ></span></button>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="#">WHO</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">WHAT</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">WHERE</a></li>
                </ul>
            </div>
        </nav>
        <div id="mycarousel" class="carousel slide" data-ride="carrousel">
            <ul class="carousel-indicators">
                <li data-target="#mycarousel" data-slide-to="0"></li>
                <li data-target="#mycarousel" data-slide-to="1" class="active"></li>
                <li data-target="#mycarousel" data-slide-to="2"></li>
            </ul>
            <div class="carousel-inner">
                <div class="carousel-item">
                    <img src="images/travel.jpg">
                </div>
                <div class="carousel-item active">
                    <img src="images/brazil.jpg">
                </div>
                <div class="carousel-item">
                    <img src="images/sky.jpg">
                </div>
            </div>
            <a class="carousel-control-prev" data-slide="prev" href="#mycarousel"><span class="carousel-control-prev-icon"></span></a>
            <a class="carousel-control-next" data-slide="next" href="#mycarousel"><span class="carousel-control-next-icon"></span></a>
        </div>
    </body>
</html>
